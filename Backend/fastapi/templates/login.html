{% extends "base.html" %}

{% block title %}Login - Telegram Stremio{% endblock %}

{% block content %}
<div class="h-[100dvh] flex items-center justify-center px-4 sm:px-6 lg:px-8 overflow-hidden">

    <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 rounded-3xl overflow-hidden shadow-2xl border border-white/10 backdrop-blur-xl">

        <!-- 🖼 Left Image Section -->
        <div class="hidden md:flex relative items-center justify-center bg-gradient-to-br from-primary/20 to-black/40">
            <img src="https://images.unsplash.com/photo-1614064641938-3bbee52942c7?q=80&w=1200&auto=format&fit=crop"
                 class="absolute inset-0 w-full h-full object-cover opacity-70"
                 alt="login image">

            <div class="relative z-10 text-center px-6">
                <h2 class="text-2xl font-bold text-white mb-2">Welcome Back 👋</h2>
                <p class="text-sm text-white/80">
                    Manage your Telegram Stremio system with ease
                </p>
            </div>
        </div>

        <!-- 🔐 Right Form Section -->
        <div class="bg-background/80 p-6 sm:p-10 flex flex-col justify-center">

            <!-- Header -->
            <div class="text-center space-y-3 mb-6">
                <div class="mx-auto flex items-center justify-center w-14 h-14 rounded-2xl bg-primary/10">
                    <i data-lucide="shield-check" class="w-7 h-7 text-primary"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Admin Login</h2>
                <p class="theme-text-secondary text-sm">
                    Access the management console
                </p>
            </div>

            {% if error %}
            <div class="flex items-center gap-3 bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 rounded-xl mb-4 animate-in fade-in slide-in-from-top-2 duration-300">
                <i data-lucide="alert-circle" class="w-5 h-5"></i>
                <p class="text-sm font-medium">{{ error }}</p>
            </div>
            {% endif %}

            <!-- Form -->
            <form method="post" class="space-y-5">

                <!-- Username -->
                <div class="space-y-2">
                    <label class="text-sm theme-text-secondary ml-1">Username</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 theme-text-secondary"></i>
                        <input type="text" name="username" required
                            class="theme-input w-full pl-10 pr-4 py-2.5 rounded-xl border-white/10 focus:ring-2 focus:ring-primary/50 outline-none"
                            placeholder="Enter admin username">
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label class="text-sm theme-text-secondary ml-1">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 theme-text-secondary"></i>

                        <input type="password" id="password" name="password" required
                            class="theme-input w-full pl-10 pr-10 py-2.5 rounded-xl border-white/10 focus:ring-2 focus:ring-primary/50 outline-none"
                            placeholder="••••••••">

                        <!-- 👁 Toggle -->
                        <button type="button" onclick="togglePassword()" 
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                            <i id="eyeIcon" data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Button -->
                <button type="submit"
                    class="w-full py-3 rounded-xl bg-primary hover:bg-primary/90 text-white font-semibold transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">

                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    Sign In
                </button>

            </form>

            <!-- Footer -->
            <div class="flex items-center justify-center space-x-4 text-xs uppercase tracking-wider theme-text-secondary mt-6">
                <a href="/status" class="hover:text-primary flex items-center gap-1">
                    <i data-lucide="activity" class="w-3 h-3"></i> Status
                </a>
                <span class="opacity-20">|</span>
                <a href="/stremio" class="hover:text-primary flex items-center gap-1">
                    <i data-lucide="book-open" class="w-3 h-3"></i> Guide
                </a>
            </div>

        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    function togglePassword() {
        const input = document.getElementById("password");
        const icon = document.getElementById("eyeIcon");

        if (input.type === "password") {
            input.type = "text";
            icon.setAttribute("data-lucide", "eye-off");
        } else {
            input.type = "password";
            icon.setAttribute("data-lucide", "eye");
        }

        lucide.createIcons();
    }
</script>

{% endblock %}
